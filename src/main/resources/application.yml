spring:
  application:
    name: quartz-sample

  #https://docs.spring.io/spring-boot/reference/io/quartz.html
  #https://www.quartz-scheduler.org/documentation/quartz-2.3.0/configuration/ConfigJDBCJobStoreClustering.html
  quartz:
    scheduler-name: quartz-sample
    job-store-type: jdbc
    jdbc:
      initialize-schema: always
    wait-for-jobs-to-complete-on-shutdown: true
    properties:
      org:
        quartz:
          scheduler:
            instanceId: AUTO
          jobStore:
            isClustered: true
            driverDelegateClass: org.quartz.impl.jdbcjobstore.StdJDBCDelegate
            useProperties: true

  datasource:
#    url: jdbc:h2:mem:test
    url: jdbc:mariadb://localhost:3306/quartz_sample
    username: root
    password: 1234

log_trace: "off"

server:
  error:
    include-message: always
    include-binding-errors: always